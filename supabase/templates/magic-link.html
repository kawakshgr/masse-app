<!-- Supabase → Authentication → Emails → Magic Link.
     Objet : Ton code de connexion Masse -->
<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;max-width:440px;margin:0 auto;padding:32px 24px;color:#05202a">
  <p style="font-size:15px;font-weight:800;letter-spacing:-.02em;color:#5636cf;margin:0 0 20px">Masse</p>
  <h1 style="font-size:22px;font-weight:800;letter-spacing:-.03em;margin:0 0 12px">Ton code de connexion</h1>
  <p style="font-size:15px;line-height:1.5;margin:0 0 20px">Entre ce code dans l’app, là où tu l’as demandé :</p>
  <p style="font-size:34px;font-weight:800;letter-spacing:.3em;text-align:center;background:#e7f2f3;border-radius:14px;padding:18px 0;margin:0 0 24px">{{ .Token }}</p>
  <p style="font-size:15px;line-height:1.5;margin:0 0 12px">Ou touche ce bouton, sur l’appareil qui l’a demandé :</p>
  <p style="margin:0 0 28px"><a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#0a8579;color:#ffffff;text-decoration:none;font-weight:600;font-size:15px;padding:12px 22px;border-radius:999px">Me connecter</a></p>
  <p style="font-size:13px;line-height:1.5;color:#5b6f76;margin:0">Le code et le lien expirent dans une heure. Si tu n’as rien demandé, ignore cet e-mail : personne ne peut se connecter sans lui.</p>
</div>
